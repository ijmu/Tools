# Egern V3 Low Power — iPhone / Douyin Live optimized
# Generated: 2026-08-01
# Replace the subscription URL placeholders before importing.

ipv6: false
http_port: 3080
socks_port: 3090
allow_external_connections: false
vif_only: true
block_quic: false
hide_vpn_icon: false
close_connections_on_policy_change: true
hijack_dns:
  - "*"

geoip_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country-without-asn.mmdb
asn_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-ASN.mmdb
proxy_latency_test_url: https://www.gstatic.com/generate_204
direct_latency_test_url: https://wifi.vivo.com.cn/generate_204

compat_route: false
include_all_networks: false
include_apns: false
include_cellular_services: false
include_local_networks: false

bypass_tunnel_proxy:
  - localhost
  - "*.local"
  - "*.lan"
  - "*.home.arpa"
  - 127.0.0.0/8
  - 169.254.0.0/16
  - 192.168.0.0/16
  - 172.16.0.0/12
  - 10.0.0.0/8
  - 100.64.0.0/10
  - "fd7a:115c:a1e0::/48"
  # High-throughput Douyin video/live traffic bypasses the VPN tunnel itself.
  - amemv.com
  - "*.amemv.com"
  - douyin.com
  - "*.douyin.com"
  - douyincdn.com
  - "*.douyincdn.com"
  - douyinliving.com
  - "*.douyinliving.com"
  - douyinpic.com
  - "*.douyinpic.com"
  - douyinstatic.com
  - "*.douyinstatic.com"
  - douyinvod.com
  - "*.douyinvod.com"
  - idouyinvod.com
  - "*.idouyinvod.com"
  - iesdouyin.com
  - "*.iesdouyin.com"
  - huoshanstatic.com
  - "*.huoshanstatic.com"
  - huoshanzhibo.com
  - "*.huoshanzhibo.com"
  - volccdn.com
  - "*.volccdn.com"
  - volcvideo.com
  - "*.volcvideo.com"

real_ip_domains:
  - "*.lan"
  - "*.local"
  - "*.home.arpa"
  - "*.push.apple.com"
  - "*.icloud.com"
  - "*.icloud-content.com"
  - "*.mzstatic.com"
  - "*.me.com"
  - "*.music.apple.com"
  - "*.apple.com"
  - "*.baidu.com"
  - "*.bdstatic.com"
  - "*.bilibili.com"
  - "*.douyin.com"
  - "*.douyincdn.com"
  - "*.douyinliving.com"
  - "*.douyinpic.com"
  - "*.douyinstatic.com"
  - "*.douyinvod.com"
  - "*.idouyinvod.com"
  - "*.iesdouyin.com"
  - "*.amemv.com"
  - "*.huoshanstatic.com"
  - "*.huoshanzhibo.com"
  - "*.volccdn.com"
  - "*.volcvideo.com"
  - "*.jd.com"
  - "*.qq.com"
  - "*.taobao.com"
  - "*.tmall.com"
  - "*.weixin.qq.com"

dns:
  bootstrap:
    - system
    - 223.5.5.5
    - 119.29.29.29
  upstreams:
    domestic:
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    global:
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
  forward:
    - domain_suffix:
        match: local
        value: bootstrap
    - domain_suffix:
        match: lan
        value: bootstrap
    - domain_suffix:
        match: home.arpa
        value: bootstrap
    # Douyin uses many short-lived live/CDN hosts; system DNS is the lowest-overhead path.
    - domain_suffix:
        match: douyin.com
        value: bootstrap
    - domain_suffix:
        match: douyincdn.com
        value: bootstrap
    - domain_suffix:
        match: douyinliving.com
        value: bootstrap
    - domain_suffix:
        match: douyinpic.com
        value: bootstrap
    - domain_suffix:
        match: douyinstatic.com
        value: bootstrap
    - domain_suffix:
        match: douyinvod.com
        value: bootstrap
    - domain_suffix:
        match: idouyinvod.com
        value: bootstrap
    - domain_suffix:
        match: iesdouyin.com
        value: bootstrap
    - domain_suffix:
        match: amemv.com
        value: bootstrap
    - domain_suffix:
        match: huoshanstatic.com
        value: bootstrap
    - domain_suffix:
        match: huoshanzhibo.com
        value: bootstrap
    - domain_suffix:
        match: volccdn.com
        value: bootstrap
    - domain_suffix:
        match: volcvideo.com
        value: bootstrap
    - proxy_rule_set:
        match: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/Egern/Rules/Reject.yaml
        value: reject
        update_interval: 86400
    - domain_suffix:
        match: cn
        value: domestic
    - proxy_rule_set:
        match: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/Egern/Rules/ChinaDomain.yaml
        value: domestic
        update_interval: 86400
    - wildcard:
        match: "*"
        value: global
  public_ip_lookup_url: https://ifconfig.me/ip

policy_groups:
  # Latest Egern syntax: subscriptions can be mounted directly on a normal group.
  - select:
      name: Subscription
      urls:
        - 订阅地址1
        - 订阅地址2
      filter: '^(?!.*(?:套餐|订阅|到期|重置|剩余|续费|客户端|官网|流量|频道|公告)).+$'
      update_interval: 86400
      icon: link
      hidden: false

  - select:
      name: Manual
      policies:
        - Subscription
      flatten: true
      icon: hand.tap
      hidden: false

  - smart:
      name: Automatic
      policies:
        - Subscription
      flatten: true
      priorities:
        '(?i)专线|IEPL|IPLC|Premium': 0.85
        '(?i)免费|Free|倍率\s*0\.[12]': 1.25
      icon: bolt
      hidden: false

  - select:
      name: HK
      policies:
        - Subscription
      flatten: true
      filter: '(?i)🇭🇰|香港|\b(?:HK|HKG|Hong\s*Kong)\b'
      icon: flag
      hidden: false

  - select:
      name: TW
      policies:
        - Subscription
      flatten: true
      filter: '(?i)🇹🇼|台湾|台灣|\b(?:TW|TWN|Taiwan)\b'
      icon: flag
      hidden: false

  - select:
      name: JP
      policies:
        - Subscription
      flatten: true
      filter: '(?i)🇯🇵|日本|东京|東京|\b(?:JP|JPN|Japan|Tokyo)\b'
      icon: flag
      hidden: false

  - select:
      name: SG
      policies:
        - Subscription
      flatten: true
      filter: '(?i)🇸🇬|新加坡|狮城|獅城|\b(?:SG|SGP|Singapore)\b'
      icon: flag
      hidden: false

  - select:
      name: US
      policies:
        - Subscription
      flatten: true
      filter: '(?i)🇺🇸|美国|美國|洛杉矶|洛杉磯|圣何塞|聖何塞|\b(?:US|USA|United\s*States)\b'
      icon: flag
      hidden: false

  - select:
      name: Other
      policies:
        - Subscription
      flatten: true
      filter: '(?i)^(?!.*(?:🇭🇰|香港|\bHK\b|🇹🇼|台湾|台灣|\bTW\b|🇯🇵|日本|\bJP\b|🇸🇬|新加坡|\bSG\b|🇺🇸|美国|美國|\bUS\b|套餐|订阅|到期|剩余|流量)).+$'
      icon: globe.asia.australia
      hidden: true

  - fallback:
      name: Stable
      policies:
        - HK
        - SG
        - JP
        - US
        - TW
        - Other
      interval: 1800
      timeout: 5
      icon: arrow.triangle.2.circlepath
      hidden: false

  - select:
      name: Proxy
      policies:
        - Stable
        - Automatic
        - Manual
        - HK
        - SG
        - JP
        - TW
        - US
        - Other
        - DIRECT
      icon: globe
      hidden: false

  - select:
      name: AI
      policies:
        - US
        - SG
        - JP
        - Manual
      icon: brain
      hidden: false

  - select:
      name: Telegram
      policies:
        - Stable
        - SG
        - US
        - HK
        - Manual
      icon: paperplane
      hidden: false

  - select:
      name: TikTok
      policies:
        - SG
        - JP
        - TW
        - US
        - Manual
      icon: music.note
      hidden: false

  - select:
      name: Social
      policies:
        - Stable
        - US
        - SG
        - HK
        - JP
        - Manual
      icon: person.2
      hidden: false

  - select:
      name: YouTube
      policies:
        - HK
        - SG
        - JP
        - US
        - Stable
        - Manual
      icon: play.rectangle
      hidden: false

  - select:
      name: Streaming
      policies:
        - Stable
        - SG
        - JP
        - TW
        - US
        - HK
        - Manual
      icon: play.tv
      hidden: false

  - select:
      name: Google
      policies:
        - Stable
        - SG
        - JP
        - US
        - HK
        - Manual
      icon: magnifyingglass
      hidden: false

  - select:
      name: Microsoft
      policies:
        - DIRECT
        - Stable
        - HK
        - US
        - Manual
      icon: laptopcomputer
      hidden: false

  - select:
      name: Apple
      policies:
        - DIRECT
        - Stable
        - HK
        - US
        - Manual
      icon: apple.logo
      hidden: false

  - select:
      name: Crypto
      policies:
        - Stable
        - SG
        - JP
        - TW
        - HK
        - US
        - Manual
      icon: bitcoinsign.circle
      hidden: false

  - select:
      name: Final
      policies:
        - Proxy
        - DIRECT
        - Manual
      icon: ellipsis.circle
      hidden: false

# Rules are first-match. Specific services precede broad domestic/final rules.
rules:
  - ssid:
      name: Trusted Wi-Fi
      match: "YourHomeWiFi"
      policy: DIRECT

  - domain:
      name: Anti-fraud endpoint
      match: 96110.cn
      policy: REJECT

  - domain_suffix:
      name: Anti-fraud endpoint
      match: gjfzpt.cn
      policy: REJECT

  - rule_set:
      name: LAN
      match: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/Egern/Rules/Lan.yaml
      policy: DIRECT
      update_interval: 86400

  - rule_set:
      name: Direct exceptions
      match: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/Egern/Rules/Direct.yaml
      policy: DIRECT
      update_interval: 86400

  - rule_set:
      name: Advertising and tracking
      match: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/Egern/Rules/Reject.yaml
      policy: REJECT
      update_interval: 86400

  # Resolve shared Chinese CDN/vendor domains before overseas service rules.
  - rule_set:
      name: China domains
      match: https://raw.githubusercontent.com/Repcz/Tool/refs/heads/X/Egern/Rules/ChinaDomain.yaml
