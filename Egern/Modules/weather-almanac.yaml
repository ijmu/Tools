# 天气·黄历模块（Egern · 通用版）
# URL: https://raw.githubusercontent.com/ijmu/Tools/main/Egern/Modules/weather-almanac.yaml
#
# 安装：Egern → 模块 → 添加本 URL；添加“天气·黄历”脚本组件即可使用。
# 用途：中国天气网免 Key 天气 + 本地农历/干支/黄道黑道/宜忌；默认使用 Hark 玻璃卡样式。
# 参数：CITY 可填城市名、9 位城市代码或“自动”；留空同样按 IP 自动定位。
# 注意：天气数据需要网络；天气网、定位服务按下方规则直连。黄历计算支持 1900–2100，脚本内部固定启用 Hark 和显示黄历。
name: 天气·黄历
description: 中国天气网免 Key 天气 + Hark 玻璃卡 + 农历/干支/黄道黑道/宜忌；无需额外密钥
author: Minis
homepage: https://github.com/ijmu/Tools/tree/main/Egern/Modules/weather-almanac.yaml
icon: https://raw.githubusercontent.com/SIJULY/egern-radar/main/weather-icon.png

env_schema:
  CITY:
    name: 城市
    description: 要查询的城市名或 9 位城市代码，例如莆田、北京、阳江；留空或填“自动”按 IP 自动定位
    default_value: ""
    options: []

rules:
  - domain_suffix:
      match: weather.com.cn
      policy: DIRECT
      name: 中国天气网
  - domain_suffix:
      match: useragentinfo.com
      policy: DIRECT
      name: UserAgentInfo 定位
  - domain_suffix:
      match: ipapi.co
      policy: DIRECT
      name: IP 定位
  - domain_suffix:
      match: freeipapi.com
      policy: DIRECT
      name: IP 定位

scriptings:
  - generic:
      name: weather-almanac
      script_url: https://raw.githubusercontent.com/ijmu/Tools/main/Egern/Scripts/WeatherWdg-almanac.js
      timeout: 15
      env:
        ALM_STYLE: hark
        SHOW_ALM: "1"
        SHOW_FESTIVAL: "0"

widgets:
  - name: 天气·黄历
    script_name: weather-almanac
