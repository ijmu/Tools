# 晨曦天气·黄历
# 中国天气网免 Key 天气 + 本地农历 / 干支 / 宜忌；单张渐变玻璃卡，三档自适应。
# 安装：Egern → 模块 → 添加下方 URL，再在桌面添加「晨曦天气·黄历」小组件。
# URL: https://raw.githubusercontent.com/ijmu/Tools/main/Egern/Modules/weather-almanac.yaml
# 数据：天气来自中国天气网，定位按 IP 自动判断；黄历为脚本本地推算，1900–2100 可用。
name: 晨曦天气·黄历
description: 温度、湿度、天气状况、风雨提醒与本地黄历；单卡三档自适应，免 Key
author: Minis
homepage: https://github.com/ijmu/Tools/tree/main/Egern/Modules/weather-almanac.yaml
icon: https://raw.githubusercontent.com/SIJULY/egern-radar/main/weather-icon.png

env_schema:
  CITY:
    name: 城市
    description: 城市名或 9 位城市代码，例如莆田、北京、阳江；留空或填「自动」按 IP 自动定位
    default_value: ""
  ALM_STYLE:
    name: 版式
    description: aurora 为晨曦单卡版式（默认）；hark 为兼容别名；classic 可切回旧版排版
    default_value: aurora
  SHOW_ALM:
    name: 显示黄历
    description: 填 0 关闭黄历，只保留天气版式
    default_value: "1"
  SHOW_FESTIVAL:
    name: 显示节日倒数
    description: 填 1 在黄历卡显示「距 XX 节 N 天」
    default_value: "0"

rules:
  - domain_suffix:
      match: weather.com.cn
      policy: DIRECT
      name: 中国天气网
  - domain_suffix:
      match: api.live.bilibili.com
      policy: DIRECT
      name: Bilibili IP 定位
  - domain_suffix:
      match: useragentinfo.com
      policy: DIRECT
      name: UserAgentInfo 定位
  - domain_suffix:
      match: ipapi.co
      policy: DIRECT
      name: IP 定位
  - domain_suffix:
      match: freeipapi.com
      policy: DIRECT
      name: IP 定位

scriptings:
  - generic:
      name: weather-almanac
      script_url: https://raw.githubusercontent.com/ijmu/Tools/main/Egern/Scripts/WeatherWdg-almanac.js
      timeout: 60

widgets:
  - name: 晨曦天气·黄历
    script_name: weather-almanac
