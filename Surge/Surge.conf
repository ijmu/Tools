[General]
# 日志级别
loglevel = notify
# 测试链接
internet-test-url = http://wifi.vivo.com.cn/generate_204
proxy-test-url = http://1.1.1.1/generate_204
# 节点超时
test-timeout = 5
# DNS 设置
dns-server = 223.5.5.5, 119.29.29.29
# DNS 劫持
hijack-dns = *:53
# IPv6 设置
ipv6 = false
ipv6-vif = auto
# UDP 回退行为
udp-policy-not-supported-behaviour = REJECT
# 游戏模式
udp-priority = false
# 展示错误页面
show-error-page-for-reject = true
# 简单主机名由 VIF 处理
exclude-simple-hostnames = true
# GEOIP 数据库
geoip-maxmind-url = https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country-without-asn.mmdb
# 图标库地址
# https://raw.githubusercontent.com/lige47/lige_icon/main/ligeicon.json

[Proxy Group]
Add1 = select, policy-path=地址1, update-interval=10800, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/02ProxySoftLogo/Surge(8).png
Add2 = select, policy-path=地址2, update-interval=10800, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/02ProxySoftLogo/Surge(9).png
Sub = smart, policy-regex-filter=^((?!(套餐|订阅|到期|客户端|支持|流量)).)*$, no-alert=0, hidden=0, include-all-proxies=0, include-other-group="Add2, Add1", icon-url=https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/02ProxySoftLogo/Surge(15).png
Auto = select, Sub, DIRECT, HK, US, TW, JP, SG, UK, DE, PH, TR, NG, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/05icon/rocket(1).png
