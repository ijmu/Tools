# 黄历与节日模块（Egern · 通用版）
# URL: https://raw.githubusercontent.com/ijmu/Tools/main/Egern/Modules/almanac-holiday.yaml
#
# 安装：Egern → 模块 → 添加本 URL；随后在模块设置中按需调整 Env。
# 用途：一个组件同时显示北京时间（UTC+8）黄历、宜忌和国内/节气/国际节日倒计时。
# 注意：数据为本地计算，支持农历 1900–2100 年；不依赖网络。PLAINBG=1 可在渐变背景异常时回退纯色。
#
# 参数速览：SHOW_ALMANAC 控制黄历；SHOW_CN/SHOW_JIEQI/SHOW_INTL 控制三栏；
# QINGMING 控制清明归属；YI_COUNT/PER_ROW 控制条数；TITLE/URL/PLAINBG 控制显示与跳转。
name: 黄历与节日
description: 每日黄历（农历 · 干支 · 建除值神 · 冲煞 · 宜忌）与节日倒计时（国内 / 节气 / 国际）；纯本地计算，时间基准 UTC+8，日界自动刷新
author: Minis
homepage: https://github.com/ijmu/Tools/tree/main/Egern/Modules/almanac-holiday.yaml
icon: https://raw.githubusercontent.com/ijmu/Tools/main/Egern/Icons/AlmanacHoliday.svg

env_schema:
  SHOW_ALMANAC:
    name: 显示黄历
    description: 是否显示黄历信息（关闭后仅显示节日）
    default_value: "1"
    options: ["1", "0"]
  YI_COUNT:
    name: 宜忌条数
    description: 宜、忌各显示条数（0 为按尺寸自动：小 4、中 6、大 9）
    default_value: ""
    options: ["", "1", "2", "3", "4", "5", "6", "7", "8", "9"]
  QINGMING:
    name: 清明归属
    description: 清明节归属（cn=国内栏，jq=节气栏）
    default_value: "cn"
    options: ["cn", "jq"]
  SHOW_CN:
    name: 显示国内节日
    description: 是否显示国内节日栏
    default_value: "1"
    options: ["1", "0"]
  SHOW_JIEQI:
    name: 显示节气
    description: 是否显示节气栏
    default_value: "1"
    options: ["1", "0"]
  SHOW_INTL:
    name: 显示国际节日
    description: 是否显示国际节日栏
    default_value: "1"
    options: ["1", "0"]
  PER_ROW:
    name: 每栏条数
    description: 每栏显示节日条数（0 为按尺寸自动：小 1、中 6、大/加大 3）
    default_value: ""
    options: ["", "1", "2", "3", "4", "5", "6"]
  TITLE:
    name: 标题
    description: 组件标题，留空使用“黄历与节日”
    default_value: ""
  URL:
    name: 点击跳转
    description: 点击组件跳转的地址，留空打开系统日历 calshow://
    default_value: ""
  PLAINBG:
    name: 纯色背景
    description: 纯色背景（1=关闭渐变，0=使用渐变）
    default_value: "0"
    options: ["1", "0"]

scriptings:
  - generic:
      name: 黄历与节日
      script_url: https://raw.githubusercontent.com/ijmu/Tools/main/Egern/Scripts/almanac-holiday.js
      timeout: 60

widgets:
  - name: 黄历与节日
    script_name: 黄历与节日
