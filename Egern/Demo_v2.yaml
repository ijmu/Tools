rules:
- domain_keyword:
    match: '96110'
    policy: REJECT
    disabled: false
- domain_suffix:
    match: gjfzpt.cn
    policy: REJECT
    disabled: false
- ssid:
    match: MLGS_5G
    policy: DIRECT
    disabled: false
- domain_suffix:
    name: Egern
    match: egernlicense.com
    policy: DIRECT
    disabled: false
- rule_set:
    name: Direct Fix
    match: https://github.com/Repcz/Tool/raw/X/Egern/Rules/Direct.yaml
    policy: DIRECT
    update_interval: 86400
    disabled: false
- rule_set:
    match: https://github.com/Repcz/Tool/raw/X/Egern/Rules/AppleServers.yaml
    policy: Apple
    update_interval: 86400
    disabled: false

