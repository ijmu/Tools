# 黄历与节日（Egern 小组件模块）
# 订阅：https://raw.githubusercontent.com/ijmu/Tools/main/Egern/Modules/almanac-holiday.yaml
#
# 【用途】
# - 展示每日黄历，包括农历、干支、建除、值神、冲煞和宜忌。
# - 显示国内节日、二十四节气与国际节日倒数；纯本地计算，无网络依赖。
# - Small / Medium / Large 三种尺寸会按可用空间自动调整宜忌和节日条数。
#
# 【安装】
# 1. Egern → 模块 → 添加，粘贴上方订阅地址。
# 2. 保存并启用模块；需要自定义时，在模块设置中调整显示项目和条数。
# 3. 在 Egern 小组件画廊中添加“黄历与节日”。
#
# 【参数】
# - SHOW_ALMANAC：是否显示黄历；默认 1，填 0 后仅显示节日。
# - YI_COUNT：宜、忌各显示几项；留空时按尺寸自动，小 4 / 中 6 / 大 9。
# - QINGMING：清明节归属；cn=国内节日栏，jq=节气栏，默认 cn。
# - SHOW_CN：是否显示国内节日栏；默认 1，填 0 关闭。
# - SHOW_JIEQI：是否显示节气栏；默认 1，填 0 关闭。
# - SHOW_INTL：是否显示国际节日栏；默认 1，填 0 关闭。
# - PER_ROW：每栏显示几条节日；留空时按尺寸自动，小 / 中 / 大均为 3。
# - TITLE：自定义组件标题；留空时显示“黄历与节日”。
# - URL：点击组件时跳转的地址；留空时打开系统日历。
# - PLAINBG：纯色背景开关；默认 0 使用渐变，填 1 关闭渐变。
#
# 【刷新 / 缓存】
# - 黄历与节日均在设备本地计算，不请求网络，也不使用持久网络缓存。
# - 组件会根据日期和时辰自动安排刷新；跨日后显示新一天的内容。
# - 内容未更新时，请确认设备日期、时间和时区正确，再刷新或重新添加组件。
#
# 【常见问题】
# - 只想看节日倒数：将 SHOW_ALMANAC 设为 0。
# - 宜忌或节日显示不全：将 YI_COUNT / PER_ROW 留空，让组件按尺寸自动调整。
# - 不想显示某类节日：将 SHOW_CN、SHOW_JIEQI 或 SHOW_INTL 对应设为 0。
# - 背景显示异常或希望更简洁：将 PLAINBG 设为 1。
# - 点击后没有按预期跳转：在 URL 中填写 Egern 支持的完整跳转地址。
#
# 【注意事项】
# - 黄历内容属于传统文化信息，仅供日常参考，不构成决策、医疗、法律或投资建议。
# - 日期计算以 UTC+8 为基准；设备时间或时区错误会影响显示结果。
# - 参数名、脚本地址和默认值会影响组件行为，请勿随意修改。
#
# 【数据来源 / 维护边界】
# - 农历、干支、宜忌、节气与节日数据由配套脚本在本地计算。
# - 本次仅补充模块使用教程；下方原配置、参数、脚本入口、组件功能与视觉保持不变。
name: 黄历与节日
description: 每日黄历（农历 · 干支 · 建除值神 · 冲煞 · 宜忌）与节日倒计时（国内 / 节气 / 国际）。纯本地计算，无网络依赖；时间基准 UTC+8，日界自动刷新。
env_schema:
  SHOW_ALMANAC:
    name: SHOW_ALMANAC
    description: 是否显示黄历信息（关闭后仅显示节日）
    default_value: "1"
    options: ["1", "0"]
  YI_COUNT:
    name: YI_COUNT
    description: 宜忌各显示条数（0 为按尺寸自动；小 4 / 中 6 / 大 9）
    default_value: ""
    options: ["", "1", "2", "3", "4", "5", "6", "7", "8", "9"]
  QINGMING:
    name: QINGMING
    description: 清明节归属（cn=国内栏 / jq=节气栏）
    default_value: "cn"
    options: ["cn", "jq"]
  SHOW_CN:
    name: SHOW_CN
    description: 是否显示国内节日栏
    default_value: "1"
    options: ["1", "0"]
  SHOW_JIEQI:
    name: SHOW_JIEQI
    description: 是否显示节气栏
    default_value: "1"
    options: ["1", "0"]
  SHOW_INTL:
    name: SHOW_INTL
    description: 是否显示国际节日栏
    default_value: "1"
    options: ["1", "0"]
  PER_ROW:
    name: PER_ROW
    description: 每栏显示节日条数（0 为按尺寸自动；小/中 3 / 大 3）
    default_value: ""
    options: ["", "1", "2", "3", "4", "5", "6"]
  TITLE:
    name: TITLE
    description: 组件标题（默认「黄历与节日」）
    default_value: ""
    options: []
  URL:
    name: URL
    description: 点击组件跳转的地址（默认打开日历）
    default_value: ""
    options: []
  PLAINBG:
    name: PLAINBG
    description: 纯色背景（1=关闭渐变）
    default_value: "0"
    options: ["1", "0"]
scriptings:
  - generic:
      name: 黄历与节日
      script_url: https://raw.githubusercontent.com/ijmu/Tools/main/Egern/Scripts/almanac-holiday.js?v=20261018k
      timeout: 60
widgets:
  - name: 黄历与节日
    script_name: 黄历与节日
