# ══════════════════════════════════════════════════════════════
# AI_Own · 自维护 AI 分流（Egern YAML）
# ══════════════════════════════════════════════════════════════
# 合并来源：Repcz AI.yaml(51) + MetaCubeX geosite category-ai-!cn + 手工补全
#
# 收录原则（按你的要求）：
#   ✅ AI 服务商与产品的官方域名（对话/编程/绘图/推理平台）
#   ❌ github.com 系 —— api.github.com / githubcopilot.com /
#      copilot-proxy.githubusercontent.com 等全部不收，归还 GitHub 组
#   ❌ 微软系 —— copilot.microsoft.com / copilot.cloud.microsoft /
#      sydney.bing.com / msn 不收，归还 Microsoft 组
#   ❌ 遥测杂毛 —— datadoghq / sentry / qualtrics / liveperson 不收
#   ❌ 国内 AI —— 豆包/混元/通义/智谱/Kimi/MiniMax/百川/商汤 不收
#   ❌ 过宽后缀 —— googleusercontent.com / clients6.google.com 不收
#      （只收精确的 googleapis AI 端点，避免抢走 Google 组的流量）
#
# 用法：push 到 ijmu/Tools/Egern/Rules/AI_Own.yaml，规则里引用
#   https://github.com/ijmu/Tools/raw/main/Egern/Rules/AI_Own.yaml
# ══════════════════════════════════════════════════════════════

