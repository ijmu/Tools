DOMAIN-KEYWORD,96110,REJECT
DOMAIN-SUFFIX,gjfzpt.cn,REJECT
# 农行跳过代理检测
DOMAIN,msmp.abchina.com.cn,REJECT
# Fintech
RULE-SET,https://github.com/LeiyuG/Surge/raw/main/rules/Maya.list,PH
