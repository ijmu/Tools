[General]
# 日志级别
loglevel = notify
# 节点超时
test-timeout = 5
# 直连测试 URL
internet-test-url = http://connectivitycheck.platform.hicloud.com/generate_204
# 代理测速 URL
proxy-test-url = http://1.1.1.1/generate_204
# 游戏优化: 开启后优先处理 UDP 数据，会增加系统负载
udp-priority = false
# UDP 回退行为
udp-policy-not-supported-behaviour = REJECT
# DNS 服务器
dns-server = 223.5.5.5, 8.8.8.8
# IPv6 DNS 查询
ipv6 = false
# IPv6 VIF 模式
ipv6-vif = disabled
# DNS 劫持
hijack-dns = *:53
# Always Real IP Hosts
always-real-ip = <simple-hostname>, *.lan, *.direct, *.cmpassport.com, id6.me, open.e.189.cn, mdn.open.wo.cn, opencloud.wostore.cn, auth.wosms.cn, *.10099.com.cn, *.msftconnecttest.com, *.msftncsi.com, lancache.steamcontent.com
# 展示错误页面
show-error-page-for-reject = true
# 排除简单主机名
exclude-simple-hostnames = true
# 不进行协议嗅探
always-raw-tcp-hosts = 149.154.*, 91.108.*
# 自定义 GeoIP 数据库
geoip-maxmind-url = https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb

[Proxy]
CC = snell, 服务器地址, 端口, psk=密码, version=5, tfo=true

[Proxy Group]
Sub = select, policy-path=你的订阅地址, update-interval=21600, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/06jichang/flowcast666.png
Daily = select, CC, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/05icon/rocket(1).png
Auto = select, Daily, HK, US, TW, JP, SG, UK, DE, PH, TR, NG, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/02ProxySoftLogo/Surge(15).png
