# Duolingo 分流模块（Egern · 通用版）
# 订阅：https://raw.githubusercontent.com/ijmu/Tools/main/Egern/Modules/Duolingo.yaml
#
# 【用途】
# - 国际版 duolingo.com 与静态 CDN 使用 PROXY 指定的策略。
# - 中国版 duolingo.cn 直连；广告与遥测子域默认拦截。
#
# 【安装】
# 1. Egern → 模块 → 添加，粘贴上方订阅地址。
# 2. 打开模块设置，将 PROXY 填为现有代理组名或节点名。
# 3. 保存并启用模块；规则更新后重新连接一次 Egern。
#
# 【参数】
# - PROXY：国际版与 CDN 使用的策略，默认 "Proxy"。
# - ADS_POLICY：广告与遥测处理策略，默认 "REJECT"；也可填 DIRECT 或代理组名。
#
# 【刷新 / 缓存】
# - 本模块不使用脚本缓存；订阅内容更新后，在模块页手动刷新即可。
#
# 【常见问题】
# - 国际版无法连接：确认 PROXY 与 Egern 中的策略名称完全一致。
# - 广告或遥测仍被放行：确认 ADS_POLICY 未被改为 DIRECT 或其他策略。
#
# 【注意事项】
# - 广告与遥测子域规则必须排在 duolingo.com 后缀规则之前，避免被后缀规则先匹配。
# - 参数名、域名及规则顺序不要随意修改。
#
# 【数据来源】
# - blackmatrix7/ios_rule_script、MetaCubeX/meta-rules-dat、v2fly/domain-list-community。
# - www.duolingo.com 页面静态资源引用核对。
name: Duolingo
description: 多邻国：国际版走代理、中国版直连、广告与埋点默认拦截
author: ijmu
homepage: https://github.com/ijmu/Tools/tree/main/Egern/Modules/Duolingo.yaml
icon: https://raw.githubusercontent.com/ijmu/Tools/main/Egern/Icons/Duolingo.png

compat_arguments:
  PROXY: "Proxy"
  ADS_POLICY: "REJECT"
compat_arguments_desc: "PROXY：国际版 duolingo.com 与静态 CDN 使用的策略，填你配置里的代理组名或节点名（默认 Proxy）。ADS_POLICY：广告/埋点 ads-api / analytics.vpc / metrics 的处理方式，默认 REJECT，改成 DIRECT 或某个代理组名即放行。"

rules:
  # 中国版直连
  - domain_suffix:
      match: duolingo.cn
      policy: DIRECT
      name: Duolingo CN
  # 广告 / 埋点（精确子域，先于国际版后缀）
  - domain_suffix:
      match: ads-api.duolingo.com
      policy: "{{{ADS_POLICY}}}"
      name: Duolingo Ads
  - domain_suffix:
      match: analytics.vpc.duolingo.com
      policy: "{{{ADS_POLICY}}}"
      name: Duolingo Telemetry
  - domain_suffix:
      match: metrics.duolingo.com
      policy: "{{{ADS_POLICY}}}"
      name: Duolingo Metrics
  # 国际版 + 静态资源 CDN
  - domain_suffix:
      match: duolingo.com
      policy: "{{{PROXY}}}"
      name: Duolingo Global
  - domain_suffix:
      match: d35aaqx5ub95lt.cloudfront.net
      policy: "{{{PROXY}}}"
      name: Duolingo CDN
