# 小六壬模块（Egern · 通用版）
# 订阅：https://raw.githubusercontent.com/ijmu/Tools/main/Egern/Modules/xiaoliuren.yaml
#
# 【用途】
# - 按刷新时的农历月、日、时辰起马前课，展示月宫 → 日宫 → 时宫、落宫断语和六宫圆盘。
#
# 【安装】
# 1. Egern → 模块 → 添加，粘贴上方订阅地址。
# 2. 保存并启用模块，在 Egern 小组件画廊中添加“小六壬”。
#
# 【参数】
# - ZI_ROLLOVER：23:00 起是否按次日日辰起课；默认 0（关闭）。
# - SHOW_MEANING：大尺寸是否显示四句断语全诗；默认 1（显示）。
# - PLAINBG：渐变异常时切换纯色背景；默认 0（渐变）。
#
# 【刷新 / 缓存】
# - 脚本不使用网络数据或持久缓存；每次刷新按设备当前时间重新计算。
# - 组件会在下一个时辰交界附近自动刷新，也可手动刷新。
#
# 【常见问题】
# - 23:00 后日期口径不符合习惯：调整 ZI_ROLLOVER。
# - 背景显示异常或白屏：将 PLAINBG 设为 1。
# - 起课时间不正确：检查设备日期、时间及时区。
#
# 【注意事项】
# - 默认子时不换日；只有开启 ZI_ROLLOVER 后才在 23:00 起按次日计算。
# - 结果仅供传统文化娱乐参考，不构成决策或专业建议。
#
# 【数据来源 / 维护边界】
# - 农历换算与六宫规则均内置于脚本，支持 1900–2100，不依赖网络接口。
# - 教程整理不改变起课算法、时辰边界或组件布局。
name: 小六壬
description: 农历月/日/时辰起课的马前课占测：六宫圆盘、落宫断语与三宫来路，支持主屏四尺寸与锁屏三态
author: Minis
homepage: https://github.com/ijmu/Tools/tree/main/Egern/Modules/xiaoliuren.yaml
icon: https://raw.githubusercontent.com/ijmu/Tools/main/Egern/Icons/Xiaoliuren.png

env_schema:
  ZI_ROLLOVER:
    name: 子时换日
    description: 23:00 起按次日日辰起课（1=开启，0=关闭）
    default_value: "0"
    options: ["1", "0"]
  SHOW_MEANING:
    name: 显示断语全诗
    description: 大尺寸是否显示四句断语全诗（1=显示，0=隐藏）
    default_value: "1"
    options: ["1", "0"]
  PLAINBG:
    name: 纯色背景
    description: 渐变背景异常时的保险开关（1=纯色，0=渐变）
    default_value: "0"
    options: ["1", "0"]

scriptings:
  - generic:
      name: 小六壬
      script_url: https://raw.githubusercontent.com/ijmu/Tools/main/Egern/Scripts/xiaoliuren.js
      timeout: 30

widgets:
  - name: 小六壬
    script_name: 小六壬
