ipv6: false
http_port: 3080
socks_port: 3090
allow_external_connections: true
vif_only: true
block_quic: true
close_connections_on_policy_change: true
hijack_dns:
- '*:53'
geoip_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country-without-asn.mmdb
asn_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-ASN.mmdb
proxy_latency_test_url: https://www.apple.com/library/test/success.html
direct_latency_test_url: http://wifi.vivo.com.cn/generate_204
compat_route: true
include_all_networks: false
include_apns: false
include_cellular_services: false
include_local_networks: false
dns:
  bootstrap:
  - system
  - 223.5.5.5
  upstreams:
    Encrypted-DNS:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  forward:
  - domain_wildcard:
      match: '*'
      value: Encrypted-DNS
  proxy_nameservers:
  - Encrypted-DNS
real_ip_domains:
- '*.lan'
- '*.local'
- '*.push.apple.com'
policy_groups:
- select:
    name: Subscription
    policies: []
    flatten: false
    filter: ^(?!.*(?:套餐|订阅|到期|重置|剩余|续费|客户端|支持|流量|频道|官网|网址|时间|应急|过期|有效|失联|公告|群)).+$
    urls:
    - 订阅地址1
    - 订阅地址2
    update_interval: 10800
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/03CNSoft/mcdonalds.png
    hidden: false
- auto_test:
    name: Automatic
    policies:
    - Subscription
    flatten: true
    interval: 300
    tolerance: 50
    timeout: 5
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/05icon/lightning(3).png
    hidden: false
- select:
