# Bilibili PCDN Reject
# URL:https://raw.githubusercontent.com/ijmu/Tools/refs/heads/main/Egern/Rules/Reject_Bilibili_PCDN.yaml
# 引用示例（加入 Profile.yaml 的 rules）：
# - rule_set:
#     match: https://raw.githubusercontent.com/ijmu/Tools/refs/heads/main/Egern/Rules/Reject_Bilibili_PCDN.yaml
#     policy: REJECT
