rules:
# —— 本地/反诈 ——
- domain_keyword:
    match: '96110'
    policy: REJECT
    disabled: false
- domain_suffix:
    match: gjfzpt.cn
    policy: REJECT
    disabled: false
- ssid:
    match: MLGS_5G
    policy: DIRECT
    disabled: false
# —— 启动/局域网 ——
- rule_set:
    match: https://raw.githubusercontent.com/oo226/egern-config/refs/heads/main/Routing/Bootstrap-Direct.yaml
    policy: DIRECT
    update_interval: 86400
    disabled: false
- rule_set:
    match: https://ruleset.skk.moe/List/non_ip/lan.conf
    policy: DIRECT
    update_interval: 86400
