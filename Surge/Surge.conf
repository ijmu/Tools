RULE-SET,https://github.com/Repcz/Tool/raw/X/Surge/Rules/TikTok.list,TikTok
RULE-SET,https://github.com/Repcz/Tool/raw/X/Surge/Rules/Porn.list,MP4
# Crypto
RULE-SET,https://github.com/QuixoticHeart/rule-set/raw/ruleset/surge/crypto.list,Crypto
# RULE-SET,https://github.com/LeiyuG/Surge/raw/main/rules/Pionex.list,Crypto
# Telegram
RULE-SET,https://github.com/Repcz/Tool/raw/X/Surge/Rules/Telegram.list,Telegram
AND,((OR,((PROCESS-NAME,Telegram), (IN-PORT,6153))), (HOSTNAME-TYPE,IPv4)),REJECT-NO-DROP
# Google
