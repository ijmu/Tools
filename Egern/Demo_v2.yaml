    match: https://github.com/Repcz/Tool/raw/X/Egern/Rules/ChinaDomain.yaml
    policy: DIRECT
    update_interval: 86400
    disabled: false

# 【改 3 / 本版最关键】geoip 兜底不再本地解析
#   原 no_resolve: false 会把所有未命中规则的长尾海外域名交给国内 DNS 解析，
#   拿到 Cloudflare 的中国/亚太边缘 IP 后再由境外节点拨号 —— CF 判定地理异常，
#   直接出验证。Surge 对应那行本来就是 no-resolve。
#   待实测：Egern 是否真正尊重该取值，只有设备日志能定。
- geoip:
    match: CN
    policy: DIRECT
    no_resolve: true
    disabled: false
- default:
    name: Final
    policy: Proxy
