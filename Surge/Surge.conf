[General]
# 日志级别
loglevel = notify
# 测试链接
internet-test-url = http://wifi.vivo.com.cn/generate_204
proxy-test-url = http://cp.cloudflare.com/generate_204
# 节点超时
test-timeout = 5
# DNS 设置
dns-server = 223.5.5.5, 119.29.29.29
# 加密 DNS
encrypted-dns-server = https://doh.pub/dns-query, https://dns.alidns.com/dns-query
# DNS 劫持
hijack-dns = *:53
# IPv6 设置
ipv6 = false
ipv6-vif = disabled
# UDP 回退行为
udp-policy-not-supported-behaviour = REJECT
# 游戏模式
udp-priority = false
# 展示错误页面
show-error-page-for-reject = true
# 简单主机名由 VIF 处理
exclude-simple-hostnames = true
# 局域网域名真实解析
always-real-ip = *.lan, *.local
# 使用本地DNS映射
use-local-host-item-for-proxy = false
# GEOIP 数据库
geoip-maxmind-url = https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/Country-without-asn.mmdb

# 图标库地址
# https://cdn.jsdelivr.net/gh/lige47/lige_icon@main/ligeicon.json

# 先安装这个模块
# https://raw.githubusercontent.com/Yuheng0101/X/main/Scripts/GitRawAutoCDN/surge.sgmodule

[Proxy Group]
Add1 = select, policy-path=地址1, update-interval=10800, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/02ProxySoftLogo/Surge(8).png
Add2 = select, policy-path=地址2, update-interval=10800, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/02ProxySoftLogo/Surge(9).png
