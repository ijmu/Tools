# 看多标的模块（Egern · 通用版）
# 订阅：https://raw.githubusercontent.com/ijmu/Tools/main/Egern/Modules/gp-bullish.yaml
#
# 【用途】
# - 从 GP 平台读取“极力推荐 / 强烈看多 / 重仓绩优”标的，展示价格、涨幅及持仓信息。
#
# 【安装】
# 1. Egern → 模块 → 添加，粘贴上方订阅地址。
# 2. 在模块设置中填写网站、账号和密码，保存并启用模块。
# 3. 在 Egern 小组件画廊中添加“看多标的”。
#
# 【参数】
# - GP_SITE：平台地址，默认 https://gp.xsian.top。
# - GP_USER / GP_PASS：平台登录账号与密码，必填。
# - GP_DAYS：最近推荐天数，默认 7；填 0 表示不限制日期。
# - GP_SORT：排序方式，默认 date；date=推荐日期，pct=当日涨幅，pnl=累计收益率。
# - GP_MAX：最大显示数量；留空时按组件尺寸自动适配。
#
# 【刷新 / 缓存】
# - 交易时段约 5 分钟刷新，其他时段约 30 分钟刷新。
# - 请求失败时可使用 3 小时内的本地缓存；修正账号或网络后手动刷新组件。
#
# 【常见问题】
# - 提示登录失败：检查 GP_SITE、GP_USER、GP_PASS 是否正确及平台是否可访问。
# - 没有标的：检查 GP_DAYS 是否过小，或暂时填 0 取消日期过滤。
#
# 【注意事项】
# - 账号密码只填写在个人 Egern 模块设置中，不要写入配置文件或公开分享。
# - 本组件仅展示平台数据，不构成投资建议。
#
# 【数据来源 / 维护边界】
# - 数据来自 GP_SITE 指定的平台；接口或页面结构变化时可能需要维护脚本。
# - 参数、缓存、排序和组件布局由脚本实现，本教程不改变其行为。
name: 看多标的
description: 展示“极力推荐 / 强烈看多 / 重仓绩优”标的：名称 · 代码 · 推荐日期 · 现价 · 当日涨幅，并附成本价 / 收益率 / 调仓变动；支持日期、涨幅和收益率排序
author: Minis
homepage: https://github.com/ijmu/Tools/tree/main/Egern/Modules/gp-bullish.yaml
icon: https://raw.githubusercontent.com/ijmu/Tools/main/Egern/Icons/GPBullish.png

env_schema:
  GP_SITE:
    name: 网站
    description: 平台地址；站点换域名时只改这里
    default_value: https://gp.xsian.top
  GP_USER:
    name: 账号
    description: 登录用户名（必填）
    default_value: ""
  GP_PASS:
    name: 密码
    description: 登录密码（必填；填错会在组件上提示）
    default_value: ""
  GP_DAYS:
    name: 最近天数
    description: 只保留最近 N 天推荐的标的；0 表示不限制，可填任意正整数
    default_value: "7"
  GP_SORT:
    name: 排序方式
    description: pct=当日涨幅，date=推荐日期，pnl=累计收益率
    default_value: date
    options: [pct, date, pnl]
  GP_MAX:
    name: 最大显示数量
    description: 最多显示几只，留空按组件尺寸自动适配
    default_value: ""

scriptings:
  - generic:
      name: gp-bullish
      script_url: https://raw.githubusercontent.com/ijmu/Tools/main/Egern/Scripts/gp-bullish.js
      timeout: 30

widgets:
  - name: 看多标的
    script_name: gp-bullish
