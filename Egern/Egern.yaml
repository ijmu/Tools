    weatherCity: 莆田
  update_interval: 3600
  enabled: true
- name: 黄历与节日
  url: https://raw.githubusercontent.com/ijmu/Tools/main/Egern/Modules/almanac-holiday.yaml
  update_interval: 86400
  enabled: true
- name: 小六壬
  url: https://raw.githubusercontent.com/ijmu/Tools/main/Egern/Modules/xiaoliuren.yaml
  update_interval: 3600
  enabled: true
- name: 网络诊断
  url: https://raw.githubusercontent.com/zhaohantao1360-hash/Hark/main/network-radar-hark.yaml
  update_interval: 86400
  enabled: false
- name: 油价查询
  url: https://raw.githubusercontent.com/zhaohantao1360-hash/Hark/main/GasPrice-hark.yaml
  update_interval: 86400
  env:
    PROVINCE: 福建
    CITY: 莆田
    MY_FUEL: '95'
    TANK_L: '66'
  enabled: true
