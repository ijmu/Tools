# 看多标的模块（Egern · 通用版）
# URL: https://raw.githubusercontent.com/ijmu/Tools/main/Egern/Modules/gp-bullish.yaml
#
# 安装：Egern → 模块 → 添加本 URL；再填写模块设置中的网站、账号和密码，并添加“看多标的”组件。
# 用途：从 gp.xsian.top 获取“极力推荐 / 强烈看多 / 重仓绩优”标的，展示价格、涨幅及持仓信息。
# 注意：需要可用的平台账号；GP_DAYS=0 取消日期过滤。账号密码只保存在 Egern 模块设置中，不要写入分享配置。
# 参数：GP_SITE 网站；GP_USER/GP_PASS 登录信息；GP_DAYS 日期范围；GP_SORT 排序；GP_MAX 最大显示数。
name: 看多标的
description: 展示“极力推荐 / 强烈看多 / 重仓绩优”标的：名称 · 代码 · 推荐日期 · 现价 · 当日涨幅，并附成本价 / 收益率 / 调仓变动；支持日期、涨幅和收益率排序
author: Minis
homepage: https://github.com/ijmu/Tools/tree/main/Egern/Modules/gp-bullish.yaml
icon: https://raw.githubusercontent.com/ijmu/Tools/main/Egern/Icons/Duolingo.png

env_schema:
  GP_SITE:
    name: 网站
    description: 平台地址；站点换域名时只改这里
    default_value: https://gp.xsian.top
  GP_USER:
    name: 账号
    description: 登录用户名（必填）
    default_value: ""
  GP_PASS:
    name: 密码
    description: 登录密码（必填；填错会在组件上提示）
    default_value: ""
  GP_DAYS:
    name: 最近天数
    description: 只保留最近 N 天推荐的标的；0 表示不限制，可填任意正整数
    default_value: "7"
    options: []
  GP_SORT:
    name: 排序方式
    description: pct=当日涨幅，date=推荐日期，pnl=累计收益率
    default_value: date
    options: [pct, date, pnl]
  GP_MAX:
    name: 最大显示数量
    description: 最多显示几只，留空按组件尺寸自动适配
    default_value: ""
    options: []

scriptings:
  - generic:
      name: gp-bullish
      script_url: https://raw.githubusercontent.com/ijmu/Tools/main/Egern/Scripts/gp-bullish.js
      timeout: 30

widgets:
  - name: 看多标的
    script_name: gp-bullish
