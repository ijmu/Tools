direct_latency_test_url: http://wifi.vivo.com.cn/generate_204
compat_route: false
include_all_networks: false
include_apns: false
include_cellular_services: false
include_local_networks: false
dns:
  bootstrap:
  - 223.5.5.5
  - 119.29.29.29
  upstreams:
    Domestic-DNS:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
    Clean-DNS:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  forward:
  - domain_suffix:
      match: cn
      value: Domestic-DNS
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/oo226/egern-config/refs/heads/main/Routing/Bootstrap-Direct.yaml
      value: Domestic-DNS
      update_interval: 86400
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/oo226/egern-config/refs/heads/main/Routing/Unbreak.yaml
      value: Domestic-DNS
      update_interval: 86400
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/oo226/egern-config/refs/heads/main/Routing/Lan.yaml
      value: Domestic-DNS
      update_interval: 86400
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/oo226/egern-config/refs/heads/main/Routing/Foreign/AppleServers.yaml
      value: Domestic-DNS
      update_interval: 86400
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/ijmu/Tools/main/Egern/Rules/Direct_Own.yaml
      value: Domestic-DNS
      update_interval: 86400
  - proxy_rule_set:
      match: https://cdn.jsdelivr.net/gh/VPSDance/ai-proxy-rules@main/rules/egern/cn.yaml
      value: Domestic-DNS
      update_interval: 86400
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/oo226/egern-config/refs/heads/main/Routing/China-Direct.yaml
      value: Domestic-DNS
      update_interval: 86400
  - domain_wildcard:
      match: '*'
      value: Clean-DNS
  proxy_nameservers:
  - Domestic-DNS
  block_ips:
  - 0.0.0.0
  - 127.0.0.1
