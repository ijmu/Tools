[General]
# 日志级别
loglevel = notify
# 测试链接
internet-test-url = http://wifi.vivo.com.cn/generate_204
proxy-test-url = http://cp.cloudflare.com/generate_204
# 节点超时
test-timeout = 5
# DNS 设置
dns-server = 223.5.5.5, 119.29.29.29
# DNS 劫持
hijack-dns = *:53
# IPv6 设置
ipv6 = false
ipv6-vif = auto
# UDP 回退行为
udp-policy-not-supported-behaviour = REJECT
# 游戏模式
udp-priority = false
# 展示错误页面
show-error-page-for-reject = true
# 简单主机名由 VIF 处理
exclude-simple-hostnames = true
# GeoIP 数据库
geoip-maxmind-url = https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country-without-asn.mmdb
# 自动更新GeoIP数据库
disable-geoip-db-auto-update = false

[Proxy Group]
Sub = select, policy-path=你的订阅地址, update-interval=21600, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/05icon/rocket(1).png
Auto = select, HK, US, TW, JP, SG, UK, DE, PH, TR, NG, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/02ProxySoftLogo/Surge(15).png
