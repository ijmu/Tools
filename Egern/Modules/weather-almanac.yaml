# 晨曦天气·黄历（Egern 小组件模块）
# 订阅：https://raw.githubusercontent.com/ijmu/Tools/main/Egern/Modules/weather-almanac.yaml
#
# 【用途】
# - 展示中国天气网免 Key 天气，以及本地计算的农历、干支、宜忌和可选节日倒数。
# - Small / Medium / Large 三档分别适配，天气黄历与其他黄历组件相互独立。
#
# 【安装】
# 1. Egern → 模块 → 添加，粘贴上方订阅地址。
# 2. 保存并启用模块，在模块设置中选择城市与显示选项。
# 3. 在 Egern 小组件画廊中添加“晨曦天气·黄历”。
#
# 【参数】
# - CITY：城市名或 9 位城市代码；留空或填“自动”时按 IP 定位。
# - ALM_STYLE：aurora 为默认晨曦版式；hark 为兼容别名；classic 为旧版排版。
# - SHOW_ALM：填 0 隐藏黄历，默认 1。
# - SHOW_FESTIVAL：填 1 显示节日倒数，默认 0。
#
# 【刷新 / 缓存】
# - 组件约 15 分钟请求刷新；天气成功数据缓存 20 分钟。
# - 网络失败时可回退至 6 小时内缓存；城市代码缓存 30 天。
# - 定位或天气长期不更新时，可先填写明确城市名，再手动刷新组件。
#
# 【常见问题】
# - 自动定位不准：在 CITY 中填写城市名或 9 位城市代码。
# - 只想看天气：将 SHOW_ALM 设为 0。
# - 黄历未立即变化：确认设备日期正确，并手动刷新组件。
#
# 【注意事项】
# - 天气依赖公开网络数据，接口临时不可用时会显示缓存或错误提示。
# - 黄历为本地推算，支持 1900–2100；内容仅作传统文化参考。
#
# 【数据来源 / 维护边界】
# - 天气：中国天气网；自动定位使用模块规则中列出的公开定位服务。
# - 黄历：脚本内置农历与宜忌算法；不得与原“黄历与节日”组件共用入口或缓存键。
name: 晨曦天气·黄历
description: 温度、湿度、天气状况、风雨提醒与本地黄历；单卡三档自适应，免 Key
author: Minis
homepage: https://github.com/ijmu/Tools/tree/main/Egern/Modules/weather-almanac.yaml
icon: https://raw.githubusercontent.com/SIJULY/egern-radar/main/weather-icon.png

env_schema:
  CITY:
    name: 城市
    description: 城市名或 9 位城市代码，例如莆田、北京、阳江；留空或填「自动」按 IP 自动定位
    default_value: ""
  ALM_STYLE:
    name: 版式
    description: aurora 为晨曦单卡版式（默认）；hark 为兼容别名；classic 可切回旧版排版
    default_value: aurora
  SHOW_ALM:
    name: 显示黄历
    description: 填 0 关闭黄历，只保留天气版式
    default_value: "1"
  SHOW_FESTIVAL:
    name: 显示节日倒数
    description: 填 1 在黄历卡显示「距 XX 节 N 天」
    default_value: "0"

rules:
  - domain_suffix:
      match: weather.com.cn
      policy: DIRECT
      name: 中国天气网
  - domain_suffix:
      match: api.live.bilibili.com
      policy: DIRECT
      name: Bilibili IP 定位
  - domain_suffix:
      match: useragentinfo.com
      policy: DIRECT
      name: UserAgentInfo 定位
  - domain_suffix:
      match: ipapi.co
      policy: DIRECT
      name: IP 定位
  - domain_suffix:
      match: freeipapi.com
      policy: DIRECT
      name: IP 定位

scriptings:
  - generic:
      name: weather-almanac
      script_url: https://raw.githubusercontent.com/ijmu/Tools/main/Egern/Scripts/WeatherWdg-almanac.js
      timeout: 60

widgets:
  - name: 晨曦天气·黄历
    script_name: weather-almanac
