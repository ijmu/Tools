policy_groups:
- external:
    name: Subscription
    type: select
    urls:
    - 订阅地址1
    - 订阅地址2
    filter: ^(?!.*(?:套餐|订阅|到期|重置|剩余|续费|客户端|支持|流量|频道|官网)).+$
    update_interval: 10800
    hidden: false
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/05icon/jichang.png
- select:
    name: Manual
    policies:
    - Subscription
    flatten: true
    hidden: false
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/05icon/lightning(5).png
- smart:
    name: Automatic
    policies:
    - Subscription
    flatten: true
    hidden: false
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/05icon/lightning(3).png
- smart:
    name: US
    policies:
    - Subscription
    flatten: true
    filter: (?i)🇺🇸|美国|美國|洛杉矶|洛杉磯|圣何塞|聖何塞|\b(?:US|USA|United\s*States)\b
    hidden: true
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/01Country/US(1).png
- smart:
    name: HK
    policies:
    - Subscription
    flatten: true
    filter: (?i)🇭🇰|香港|\b(?:HK|Hong(?:\s*Kong)?)\b
    hidden: true
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/01Country/Hongkong(2).png
- smart:
    name: JP
    policies:
    - Subscription
    flatten: true
    filter: (?i)🇯🇵|日本|东京|東京|\b(?:JP|Japan|Tokyo)\b
    hidden: true
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/01Country/Japan(1).png
- smart:
    name: SG
    policies:
    - Subscription
    flatten: true
    filter: (?i)🇸🇬|新加坡|狮城|獅城|\b(?:SG|Singapore)\b
    hidden: true
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/01Country/singapore(2).png
- select:
    name: Proxy
    policies:
    - Automatic
    - Manual
    - US
    - HK
    - JP
    - SG
    - DIRECT
    hidden: false
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/05icon/rocket(1).png
- select:
    name: AI
    policies:
    - US
    - SG
    - JP
    - Manual
    hidden: false
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/04ProxySoft/claude(1).png
- select:
    name: Crypto
    policies:
    - Proxy
    - US
    - HK
    - SG
    - JP
    - Manual
    hidden: false
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/04ProxySoft/Bitcoin.png
- select:
    name: Pay
    policies:
    - Proxy
    - US
    - HK
    - SG
    - Manual
    hidden: false
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/04ProxySoft/paypal(2).png
- select:
    name: TikTok
    policies:
    - US
    - SG
    - JP
    - Manual
    hidden: false
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/04ProxySoft/tiktok((2).png
