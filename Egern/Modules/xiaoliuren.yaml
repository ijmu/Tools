# 小六壬模块（Egern · 通用版）
# URL: https://raw.githubusercontent.com/ijmu/Tools/main/Egern/Modules/xiaoliuren.yaml
#
# 安装：Egern → 模块 → 添加本 URL；添加“小六壬”脚本组件即可使用。
# 用途：按农历月、日、时辰起马前课，显示月宫 → 日宫 → 时宫、落宫断语和六宫圆盘。
# 注意：刷新时取系统时间；默认子时不换日。结果仅供传统文化娱乐参考，不构成任何建议。
# 参数：ZI_ROLLOVER 控制 23:00 子时换日；SHOW_MEANING 控制大尺寸断语全诗；PLAINBG 控制背景。
name: 小六壬
description: 农历月/日/时辰起课的马前课占测：六宫圆盘、落宫断语与三宫来路，支持主屏四尺寸与锁屏三态
author: Minis
homepage: https://github.com/ijmu/Tools/tree/main/Egern/Modules/xiaoliuren.yaml
icon: https://raw.githubusercontent.com/ijmu/Tools/main/Egern/Icons/Xiaoliuren.png

env_schema:
  ZI_ROLLOVER:
    name: 子时换日
    description: 23:00 起按次日日辰起课（1=开启，0=关闭）
    default_value: "0"
    options: ["1", "0"]
  SHOW_MEANING:
    name: 显示断语全诗
    description: 大尺寸是否显示四句断语全诗（1=显示，0=隐藏）
    default_value: "1"
    options: ["1", "0"]
  PLAINBG:
    name: 纯色背景
    description: 渐变背景异常时的保险开关（1=纯色，0=渐变）
    default_value: "0"
    options: ["1", "0"]

scriptings:
  - generic:
      name: 小六壬
      script_url: https://raw.githubusercontent.com/ijmu/Tools/main/Egern/Scripts/xiaoliuren.js
      timeout: 30

widgets:
  - name: 小六壬
    script_name: 小六壬
