      match: https://raw.githubusercontent.com/oo226/egern-config/refs/heads/main/Routing/Foreign/ProxyGFW.yaml
      value: Global
      update_interval: 86400
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/oo226/egern-config/refs/heads/main/Routing/Foreign/Proxy.yaml
      value: Global
      update_interval: 86400
  - domain_wildcard:
      match: '*'
      value: China
  proxy_nameservers:
  - 223.5.5.5
  - 119.29.29.29
