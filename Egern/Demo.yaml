ipv6: false
http_port: 3080
socks_port: 3090
allow_external_connections: false
vif_only: true
close_connections_on_policy_change: false
hide_vpn_icon: false
hijack_dns:
- '*:53'
geoip_db_url: https://raw.githubusercontent.com/Masaiki/GeoIP2-CN/release/Country.mmdb
proxy_latency_test_url: https://www.apple.com/library/test/success.html
direct_latency_test_url: http://connectivitycheck.gstatic.com/generate_204
compat_route: false
include_all_networks: false
include_apns: false
include_cellular_services: false
include_local_networks: false
dns:
  bootstrap:
  - system
  - 223.5.5.5
  - 119.29.29.29
  upstreams:
    China:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    Global:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  forward:
  - proxy_rule_set:
      match: https://ruleset.skk.moe/List/non_ip/lan.conf
      value: China
  - proxy_rule_set:
      match: https://ruleset.skk.moe/List/non_ip/apple_cdn.conf
      value: China
  - proxy_rule_set:
      match: https://ruleset.skk.moe/List/non_ip/microsoft_cdn.conf
      value: China
  - proxy_rule_set:
      match: https://ruleset.skk.moe/List/non_ip/apple_cn.conf
      value: China
  - proxy_rule_set:
      match: https://ruleset.skk.moe/List/non_ip/direct.conf
      value: China
  - proxy_rule_set:
      match: https://ruleset.skk.moe/List/non_ip/domestic.conf
      value: China
  - domain_wildcard:
      match: '*'
      value: Global
  hosts:
    dns.google:
    - 8.8.8.8
    - 8.8.4.4
    dns.alidns.com:
    - 223.5.5.5
    - 223.6.6.6
    doh.pub:
    - 1.12.12.12
    - 120.53.53.53
  proxy_nameservers:
  - 223.5.5.5
  - 119.29.29.29
  public_ip_lookup_url: https://ifconfig.me/ip
bypass_tunnel_proxy:
- '*.ts.net'
- tailscale.com
